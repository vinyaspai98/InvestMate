<div class="login-container">
  <div class="theme-toggle">
    <button mat-icon-button (click)="toggleTheme()" aria-label="Toggle theme">
      <mat-icon>{{ (themeService.isDarkTheme$ | async) ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>

  <div class="login-card-container">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title class="login-title">
          <mat-icon class="app-icon">account_balance_wallet</mat-icon>
          InvestMate
        </mat-card-title>
        <mat-card-subtitle>Welcome back! Sign in to your account</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="Enter your email" autocomplete="username">
            <mat-icon matSuffix>email</mat-icon>
            <mat-error *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
              {{ getErrorMessage('email') }}
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
              placeholder="Enter your password" autocomplete="current-password">
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
              [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
              {{ getErrorMessage('password') }}
            </mat-error>
          </mat-form-field>

          <div class="form-actions">
            <button mat-raised-button color="primary" type="submit" class="full-width login-button"
              [disabled]="isLoading">
              <mat-icon *ngIf="isLoading">hourglass_empty</mat-icon>
              {{ isLoading ? 'Signing in...' : 'Sign In' }}
            </button>

            <button mat-button type="button" color="accent" (click)="onResetPassword()" class="reset-password-button">
              Forgot Password?
            </button>
          </div>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <div class="signup-link">
          Don't have an account?
          <a routerLink="/signup" mat-button color="primary">Sign Up</a>
        </div>
      </mat-card-actions>
    </mat-card>
  </div>

  <div class="demo-credentials">
    <mat-card class="demo-card">
      <mat-card-content>
        <h3>Demo Credentials</h3>
        <p><strong>Email:</strong> test@investmate.com</p>
        <p><strong>Password:</strong> test123</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
